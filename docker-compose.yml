services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  keycloak:
    build:
      context: .
      dockerfile: keycloak-email-otp-provider/Dockerfile
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_SPI_THEME_CACHE_THEMES: false
      KC_SPI_THEME_CACHE_TEMPLATES: false

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app

      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost/auth
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak-themes:/opt/keycloak/themes
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spa_kc_login
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost/auth/realms/spa-kc-login
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/spa-kc-login/protocol/openid-connect/certs
      APP_KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080/auth
      APP_KEYCLOAK_ADMIN_REALM: spa-kc-login
      APP_KEYCLOAK_ADMIN_ADMIN_REALM: spa-kc-login
      APP_KEYCLOAK_ADMIN_CLIENT_ID: registration-service
      APP_KEYCLOAK_ADMIN_CLIENT_SECRET: B8fEuIUwWhrjYrAoRpqlBQA0mliaeaDh
    volumes:
      - ./runtime-data:/app/runtime-data
    depends_on:
      - postgres
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
      - keycloak

  nginx:
    image: nginx:1.29
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  postgres-data: