spring:
  application:
    name: spa-kc-login

  datasource:
    url: jdbc:postgresql://localhost:5432/spa_kc_login
    username: app
    password: app
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8180/realms/spa-kc-login"

app:
  keycloak:
    admin:
      server-url: "http://localhost:8180"
      realm: "spa-kc-login"
      admin-realm: "master"
      client-id: admin-cli
      username: admin
      password: admin